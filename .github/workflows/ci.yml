name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          # .golangci.yml is in the v1 format, which golangci-lint v2 refuses.
          version: v1.64.8
          args: --timeout=5m

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version consistency across constants.go, CHANGELOG.md, and README.md
        run: |
          CONST_VERSION=$(grep -oP 'Version = "\K[^"]+' pkg/costco/constants.go)
          CHANGELOG_VERSION=$(grep -m1 -oP '## \[\K[^\]]+' CHANGELOG.md)
          README_VERSION=$(grep -oP 'version-\K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)

          echo "constants.go : $CONST_VERSION"
          echo "CHANGELOG.md : $CHANGELOG_VERSION"
          echo "README.md    : $README_VERSION"

          if [ "$CONST_VERSION" != "$CHANGELOG_VERSION" ] || [ "$CONST_VERSION" != "$README_VERSION" ]; then
            echo ""
            echo "Version mismatch! All three must agree."
            echo "Update constants.go, CHANGELOG.md, and README.md to the same version before merging."
            exit 1
          fi

          echo "All versions consistent: $CONST_VERSION"

  binaries:
    name: Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build every platform
        run: scripts/build-release.sh dist

      - name: Upload Windows (x64)
        uses: actions/upload-artifact@v4
        with:
          name: costco-cli-windows-amd64.exe
          path: dist/costco-cli-windows-amd64.exe
          if-no-files-found: error

      - name: Upload Linux (x64)
        uses: actions/upload-artifact@v4
        with:
          name: costco-cli-linux-amd64
          path: dist/costco-cli-linux-amd64
          if-no-files-found: error

      - name: Upload Linux (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: costco-cli-linux-arm64
          path: dist/costco-cli-linux-arm64
          if-no-files-found: error

      - name: Upload macOS (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: costco-cli-darwin-arm64
          path: dist/costco-cli-darwin-arm64
          if-no-files-found: error

      - name: Upload macOS (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: costco-cli-darwin-amd64
          path: dist/costco-cli-darwin-amd64
          if-no-files-found: error

      - name: Upload all platforms with SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: costco-cli-all-platforms
          path: dist/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    needs: binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: costco-cli-linux-amd64
          - os: ubuntu-24.04-arm
            binary: costco-cli-linux-arm64
          - os: macos-latest
            binary: costco-cli-darwin-arm64
          - os: windows-latest
            binary: costco-cli-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build from source
        run: go build -v ./...

      - name: Download the binary built for this platform
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist

      - name: Run the downloaded binary
        shell: bash
        run: |
          binary="dist/${{ matrix.binary }}"
          chmod +x "$binary"
          want=$(sed -n 's/.*Version = "\(.*\)".*/\1/p' pkg/costco/constants.go)
          got=$("./$binary" -version)
          echo "$got"
          case "$got" in
            "costco-cli $want (commit "*) ;;
            *) echo "expected costco-cli $want with a commit"; exit 1 ;;
          esac
          "./$binary" -cmd info
